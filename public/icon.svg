<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="icon-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d4edd" />
      <stop offset="50%" stop-color="#7311d4" />
      <stop offset="100%" stop-color="#560bad" />
    </linearGradient>
    <linearGradient id="icon-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#191022" stroke="url(#icon-purple)" stroke-width="2" />
  <circle cx="32" cy="32" r="26" stroke="url(#icon-gold)" stroke-width="0.8" opacity="0.4" stroke-dasharray="2 3"/>

  <!-- Crescent Moon -->
  <path d="M 36 12 C 22 12 12 22 12 36 C 12 50 22 60 36 60 C 26 54 20 44 20 32 C 20 20 26 14 36 12 Z" 
        fill="url(#icon-purple)" />

  <!-- 8-Point Star -->
  <g transform="translate(36, 28)" filter="url(#icon-glow)">
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="url(#icon-gold)"/>
    <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2" transform="rotate(45)" fill="url(#icon-gold)" opacity="0.8"/>
    <circle cx="0" cy="0" r="1.5" fill="#ffffff" />
  </g>

  <!-- Sparkles -->
  <circle cx="16" cy="18" r="1" fill="#f9e498" opacity="0.8"/>
  <circle cx="48" cy="46" r="1.2" fill="#d4af37" opacity="0.9"/>
  <circle cx="42" cy="14" r="0.8" fill="#fff" opacity="0.7"/>
</svg>
